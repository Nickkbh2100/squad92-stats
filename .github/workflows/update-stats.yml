name: Opdater PUBG stats

on:
  schedule:
    - cron: "23 * * * *"   # hver time
  workflow_dispatch: {}      # kan også startes manuelt under "Actions"

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hent kampe
        env:
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
        run: node scripts/fetch.mjs
      - name: Gem nye data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          if git diff --cached --quiet; then
            echo "Ingen ændringer."
          else
            git commit -m "Opdater stats"
            git push
          fi
